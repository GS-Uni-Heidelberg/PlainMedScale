# ----- Jargon density (pipeline_jargon.py) ----------------------------------

[[metrics]]
# Raw values are jargon tokens per 100 tokens; scaled by 0.01 to a plain 0--1
# share, so it reads like the other share metrics (noun_ratio, function_word_
# ratio, ...) and needs no unit in the label. Deliberately NOT in PMW like
# word_freq*: the two are different kinds of quantity (share of *this text's*
# tokens vs. corpus frequency of the words it uses). Three decimals rather
# than the usual two -- the observed range is roughly 0.00--0.30, so two would
# collapse the low-jargon sources onto the same value.
key = "jargon_per_100"
title_en = "Jargon density"
title_de = "Fachwortdichte"
dir_key = "jarg"
expected_sign = -1
decimals = 3
scale = 0.01

