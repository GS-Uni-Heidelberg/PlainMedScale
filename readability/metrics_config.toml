# Single source of truth for readability/jargon metric metadata.
#
# Consumers:
#   readability/stats_direction.py    -> key, dir_key, expected_sign
#   readability/reporting/make_metrics_table.py -> key, title_en, dir_key, expected_sign, decimals
#   readability/graphs.ipynb          -> key, title_de
#   readability/stats_gap.py          -> key, dir_key, expected_sign
#
# Fields:
#   key            TSV column name. Must match the pipeline output exactly.
#   title_en       short English label for paper tables. Written LaTeX-native
#                  (e.g. `--` for an en-dash, `\%` for a percent sign) because
#                  make_metrics_table.py emits it verbatim. Plot scripts must
#                  route it through metrics_config.plot_title() to undo those
#                  escapes -- matplotlib does not read LaTeX.
#   title_de       longer German label used in the boxplot notebook. Figures
#                  only, never LaTeX, so plain text (no escaping).
#   dir_key        which directory family the metric lives in:
#                    "std"  -> data/metrics_strip
#                    "llm"  -> data/metrics_llm_strip
#                    "jarg" -> data/jargon_density
#   expected_sign  expected direction of the metric as readability INCREASES:
#                    +1  metric should INCREASE
#                    -1  metric should DECREASE
#                     0  no committed prior; reported but not graded
#                  Pre-register the sign BEFORE looking at the data to avoid
#                  double-dipping; post-hoc sign changes should be flagged in
#                  comments below.
#   decimals       number of decimal places when rendering mean +/- std in
#                  the paper table. Default 2.

[[metrics]]
key = "avg_sentence_length"
title_en = "Words per sentence"
title_de = "Durchschnittliche Satzlänge"
dir_key = "std"
expected_sign = -1
decimals = 2

